<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>SF Design Week 2026 — Event Browser</title>
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css"
        />
        <script src="sfdw_events_mapped.js"></script>
        <style>
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family:
                    -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: #f5f4f0;
                color: #1a1a1a;
                height: 100vh;
                display: flex;
                flex-direction: column;
            }
            header {
                padding: 12px 20px;
                background: white;
                border-bottom: 1px solid #e5e5e5;
                display: flex;
                align-items: center;
                gap: 12px;
                flex-shrink: 0;
            }
            header h1 {
                font-size: 16px;
                font-weight: 600;
            }
            header .sub {
                font-size: 13px;
                color: #888;
            }
            .shell {
                display: flex;
                flex: 1;
                overflow: hidden;
            }
            .map-pane {
                flex: 1 1 60%;
                position: relative;
                overflow: hidden;
            }
            #map {
                width: 100%;
                height: 100%;
            }
            .map-badge {
                position: absolute;
                top: 12px;
                left: 12px;
                background: white;
                border: 1px solid #e5e5e5;
                border-radius: 8px;
                padding: 7px 12px;
                font-size: 13px;
                font-weight: 500;
                z-index: 1000;
                display: flex;
                align-items: center;
                gap: 8px;
                pointer-events: none;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
            }
            .map-dot {
                width: 8px;
                height: 8px;
                border-radius: 50%;
                background: #1d9e75;
                flex-shrink: 0;
            }
            .events-pane {
                flex: 0 0 420px;
                border-left: 1px solid #e5e5e5;
                display: flex;
                flex-direction: column;
                overflow: hidden;
                background: white;
            }
            .day-tabs {
                display: flex;
                gap: 6px;
                padding: 12px 16px;
                flex-shrink: 0;
                overflow-x: auto;
                scrollbar-width: none;
            }
            .day-tabs::-webkit-scrollbar {
                display: none;
            }
            .dtab {
                font-size: 13px;
                padding: 7px 14px;
                border-radius: 20px;
                border: 1px solid #e5e5e5;
                color: #666;
                cursor: pointer;
                white-space: nowrap;
                background: transparent;
                flex-shrink: 0;
                transition: all 0.15s;
            }
            .dtab.active {
                background: #f0f0f0;
                color: #111;
                border-color: #ccc;
                font-weight: 600;
            }
            .dtab:hover {
                background: #f7f7f7;
            }
            .evlist {
                flex: 1;
                overflow-y: auto;
                padding: 0 0 16px;
            }
            .tlabel {
                font-size: 14px;
                background-color: #e5e5e5;
                font-weight: 600;
                color: black;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                padding: 10px 16px 10px;
                position: sticky;
                top: 0;
                z-index: 2;
                border-bottom: 1px solid #f0f0f0;
            }
            .ecard {
                padding: 10px 16px;
                cursor: pointer;
                border-bottom: 1px solid #f5f5f5;
                transition: background 0.1s;
            }
            .ecard:hover {
                background: #fafafa;
            }
            .ecard.sel {
                background: #f5faf8;
                border-left: 3px solid #1d9e75;
                padding-left: 13px;
            }
            .ename {
                font-size: 13px;
                font-weight: 500;
                line-height: 1.35;
                margin-bottom: 6px;
            }
            .emeta {
                display: flex;
                align-items: center;
                gap: 5px;
                flex-wrap: wrap;
                margin-bottom: 8px;
                font-size: 12px;
            }
            .etime {
                color: #888;
            }
            .etag {
                font-size: 10px;
                padding: 2px 7px;
                border-radius: 20px;
                font-weight: 500;
            }
            .tag-talk {
                background: #e8f2fd;
                color: #1a5fa8;
            }
            .tag-social {
                background: #e2f5ee;
                color: #0f6e56;
            }
            .tag-workshop {
                background: #fef3e2;
                color: #7a4a0a;
            }
            .tag-studio {
                background: #f0eeff;
                color: #4a3a9a;
            }
            .tag-exhibition {
                background: #fdeee8;
                color: #8a3a1a;
            }
            .eloc {
                font-size: 12px;
                color: #999;
                display: flex;
                align-items: center;
                gap: 3px;
            }
            .pnum {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                width: 17px;
                height: 17px;
                border-radius: 50%;
                color: white;
                font-size: 9px;
                font-weight: 600;
                margin-right: 5px;
                flex-shrink: 0;
                vertical-align: middle;
            }
            .detail-col {
                flex: 0 0 0;
                overflow: hidden;
                border-left: 1px solid #e5e5e5;
                background: white;
                transition: flex-basis 0.22s ease;
                position: relative;
            }
            .detail-col.open {
                flex: 0 0 280px;
            }
            .detail {
                padding: 16px 18px 18px;
                height: 100%;
                display: flex;
                flex-direction: column;
                width: 280px;
            }
            .dscroll {
                overflow-y: auto;
                flex: 1;
                margin-top: 20px;
            }
            .dtitle {
                font-size: 20px;
                font-weight: 600;
                line-height: 1.35;
                padding-right: 28px;
            }
            .dmeta {
                font-size: 16px;
                color: #888;
                margin: 5px 0 10px;
            }
            .ddesc {
                font-size: 12.5px;
                color: #444;
                line-height: 1.7;
            }
            .dlink {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 6px;
                font-size: 13px;
                color: white;
                background: #1d9e75;
                text-decoration: none;
                margin-top: 14px;
                font-weight: 600;
                padding: 10px 14px;
                border-radius: 8px;
                flex-shrink: 0;
            }
            .dlink:hover {
                background: #178a64;
            }
            .dclose {
                position: absolute;
                top: 16px;
                right: 16px;
                background: none;
                border: none;
                cursor: pointer;
                color: #aaa;
                font-size: 20px;
                line-height: 1;
            }
            .dclose:hover {
                color: #555;
            }
            .empty {
                padding: 40px 16px;
                text-align: center;
                font-size: 13px;
                color: #aaa;
            }
            .selected-marker svg {
                scale: 1.3;
            }
        </style>
    </head>
    <body>
        <header>
            <div>
                <h1>SF Design Week 2026</h1>
            </div>
            <div class="day-tabs" id="dayTabs"></div>
            <!--
            <div class="sub">
                20th Anniversary · Theme: Multitudes · June 1–12
            </div>
            -->
        </header>

        <div class="shell">
            <div class="map-pane">
                <div class="map-badge">
                    <span class="map-dot"></span
                    ><span id="mapLabel">Loading…</span>
                </div>
                <div id="map"></div>
            </div>

            <div class="detail-col" id="detailCol">
                <div class="detail" id="detail">
                    <button
                        class="dclose"
                        onclick="closeDetail()"
                        aria-label="Close"
                    >
                        ×
                    </button>
                    <div class="dtitle" id="dtitle"></div>
                    <div class="dmeta" id="dmeta"></div>
                    <a class="dlink" id="dlink" href="#" target="_blank"
                        >View on sfdesignweek.org ↗</a
                    >
                    <div class="dscroll">
                        <div class="ddesc" id="ddesc"></div>
                    </div>
                </div>
            </div>

            <div class="events-pane">
                <div class="evlist" id="evlist"></div>
            </div>
        </div>

        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

        <script>
            const COLORS = [
                "#1D9E75",
                "#534AB7",
                "#D85A30",
                "#185FA5",
                "#BA7517",
                "#993556",
                "#3B6D11",
                "#885533",
                "#0F6E56",
                "#3C3489",
            ];

            const DAYS = [
                { key: "2026-06-06", label: "Sat Jun 6" },
                { key: "2026-06-07", label: "Sun Jun 7" },
                { key: "2026-06-08", label: "Mon Jun 8" },
                { key: "2026-06-09", label: "Tue Jun 9" },
                { key: "2026-06-10", label: "Wed Jun 10" },
                { key: "2026-06-11", label: "Thu Jun 11" },
                { key: "2026-06-12", label: "Fri Jun 12" },
            ];

            let currentDay = "2026-06-09",
                selectedId = null,
                map = null,
                markersMap = {};

            function fmt(t) {
                const [h, m] = t.split(":").map(Number);
                const ap = h >= 12 ? "PM" : "AM";
                return (
                    (m === 0
                        ? `${h % 12 || 12}`
                        : `${h % 12 || 12}:${String(m).padStart(2, "0")}`) +
                    " " +
                    ap
                );
            }
            function getSlot(s) {
                const h = parseInt(s);
                if (h < 12) return "0_Morning";
                if (h < 14) return "1_Midday";
                if (h < 17) return "2_Afternoon";
                if (h < 19) return "3_Evening (5–7 PM)";
                return "4_Evening (7–9 PM)";
            }
            function slotLabel(s) {
                return s.replace(/^\d_/, "");
            }
            function tagClass(t) {
                return (
                    {
                        talk: "tag-talk",
                        social: "tag-social",
                        workshop: "tag-workshop",
                        studio: "tag-studio",
                        exhibition: "tag-exhibition",
                    }[t] || "tag-talk"
                );
            }

            function makeIcon(color, label) {
                const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36"><path d="M14 0C6.3 0 0 6.3 0 14c0 9.6 14 22 14 22s14-12.4 14-22C28 6.3 21.7 0 14 0z" fill="${color}"/><circle cx="14" cy="14" r="9" fill="white" opacity="0.2"/><text x="14" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="white" font-family="system-ui,sans-serif">${label}</text></svg>`;
                return L.divIcon({
                    html: svg,
                    iconSize: [28, 36],
                    iconAnchor: [14, 36],
                    popupAnchor: [0, -36],
                    className: "",
                });
            }

            function initMap() {
                map = L.map("map", { zoomControl: true }).setView(
                    [37.775, -122.42],
                    13,
                );
                L.tileLayer(
                    "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
                    {
                        attribution:
                            '© <a href="https://openstreetmap.org">OpenStreetMap</a> © <a href="https://carto.com">CARTO</a>',
                        maxZoom: 19,
                        subdomains: "abcd",
                    },
                ).addTo(map);
                renderMarkers();
            }

            function renderMarkers() {
                Object.values(markersMap).forEach((m) => m.remove());
                markersMap = {};
                const evs = ALL_EVENTS.filter((e) => e.date === currentDay);
                const locCount = {},
                    locIdx = {};
                evs.forEach((ev) => {
                    const k = `${ev.lat},${ev.lng}`;
                    locCount[k] = (locCount[k] || 0) + 1;
                });
                evs.forEach((ev) => {
                    const k = `${ev.lat},${ev.lng}`;
                    if (!(k in locIdx)) locIdx[k] = 0;
                    const total = locCount[k],
                        idx = locIdx[k]++;
                    const r = total > 1 ? 0.00028 : 0;
                    const angle = (idx / total) * 2 * Math.PI - Math.PI / 2;
                    const lat = ev.lat + Math.sin(angle) * r;
                    const lng = ev.lng + Math.cos(angle) * r;
                    const color = COLORS[(ev.id - 1) % COLORS.length];
                    const marker = L.marker([lat, lng], {
                        icon: makeIcon(color, ev.id),
                    }).addTo(map);
                    marker.getElement().id = "marker-" + ev.id;
                    marker.on("click", () =>
                        openDetail(ev.id, marker.getElement()),
                    );
                    markersMap[ev.id] = marker;
                });
                const vc = Object.keys(locCount).length;
                document.getElementById("mapLabel").textContent =
                    `${DAYS.find((d) => d.key === currentDay)?.label} · ${evs.length} events · ${vc} venue${vc !== 1 ? "s" : ""}`;
                if (evs.length) {
                    const lats = evs.map((e) => e.lat),
                        lngs = evs.map((e) => e.lng),
                        pad = 0.018;
                    map.fitBounds([
                        [Math.min(...lats) - pad, Math.min(...lngs) - pad],
                        [Math.max(...lats) + pad, Math.max(...lngs) + pad],
                    ]);
                }
            }

            function renderTabs() {
                const tabs = document.getElementById("dayTabs");
                tabs.innerHTML = "";
                DAYS.forEach((d) => {
                    const cnt = ALL_EVENTS.filter(
                        (e) => e.date === d.key,
                    ).length;
                    const b = document.createElement("button");
                    b.className =
                        "dtab" + (d.key === currentDay ? " active" : "");
                    b.textContent = `${d.label} (${cnt})`;
                    b.onclick = () => {
                        currentDay = d.key;
                        selectedId = null;
                        closeDetail();
                        renderTabs();
                        renderEvents();
                        renderMarkers();
                    };
                    tabs.appendChild(b);
                });
            }

            function renderEvents() {
                const list = document.getElementById("evlist");
                list.innerHTML = "";
                const evs = ALL_EVENTS.filter((e) => e.date === currentDay);
                if (!evs.length) {
                    list.innerHTML =
                        '<div class="empty">No events listed for this day.</div>';
                    return;
                }
                const grouped = {};
                evs.forEach((e) => {
                    const s = getSlot(e.start);
                    if (!grouped[s]) grouped[s] = [];
                    grouped[s].push(e);
                });
                Object.keys(grouped)
                    .sort()
                    .forEach((slot) => {
                        const lbl = document.createElement("div");
                        lbl.className = "tlabel";
                        lbl.textContent = slotLabel(slot);
                        list.appendChild(lbl);
                        grouped[slot]
                            .sort((a, b) => a.start.localeCompare(b.start))
                            .forEach((ev) => {
                                const card = document.createElement("div");
                                card.className =
                                    "ecard" +
                                    (selectedId === ev.id ? " sel" : "");
                                card.id = `card-${ev.id}`;
                                const color =
                                    COLORS[(ev.id - 1) % COLORS.length];
                                card.innerHTML = `<div class="ename"><span class="pnum" style="background:${color}">${ev.id}</span>${ev.name}</div>
        <div class="emeta"><span class="etime">${fmt(ev.start)}–${fmt(ev.end)}</span><span class="etag ${tagClass(ev.type)}">${ev.tag}</span></div>
        <div class="eloc">📍 ${ev.venue}</div>`;
                                card.onclick = () => openDetail(ev.id);
                                list.appendChild(card);
                            });
                    });
            }

            function openDetail(id, m) {
                const elements = document.querySelectorAll(".selected-marker");
                elements.forEach((element) => {
                    element.classList.remove("selected-marker");
                });

                const currentElement = document.getElementById("marker-" + id);
                currentElement.classList.add("selected-marker");
                if (markersMap[selectedId]) {
                    markersMap[selectedId].setZIndexOffset(2); //the previous marker
                }
                markersMap[id].setZIndexOffset(100);

                const ev = ALL_EVENTS.find((e) => e.id === id);
                if (!ev) return;
                selectedId = id;
                renderEvents();
                document.getElementById("dtitle").textContent = ev.name;
                document.getElementById("dmeta").textContent =
                    `${fmt(ev.start)} – ${fmt(ev.end)}  /n  ${ev.venue}  ·  ${ev.address}`;
                document.getElementById("ddesc").textContent = ev.desc;
                document.getElementById("dlink").href = ev.url;
                document.getElementById("detailCol").classList.add("open");
                if (map) map.setView([ev.lat, ev.lng], 14, { animate: true });
                document
                    .getElementById(`card-${id}`)
                    ?.scrollIntoView({ block: "nearest", behavior: "smooth" });
            }

            function closeDetail() {
                selectedId = null;
                document.getElementById("detailCol").classList.remove("open");
                renderEvents();
            }

            document.addEventListener("DOMContentLoaded", () => {
                renderTabs();
                renderEvents();
                initMap();
            });
        </script>
    </body>
</html>
