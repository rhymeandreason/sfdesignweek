<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SF Design Week 2026 — Event Browser</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f4f0;color:#1a1a1a;height:100vh;display:flex;flex-direction:column}
header{padding:12px 20px;background:white;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;gap:12px;flex-shrink:0}
header h1{font-size:16px;font-weight:600}
header .sub{font-size:13px;color:#888}
.shell{display:flex;flex:1;overflow:hidden}
.map-pane{flex:1 1 60%;position:relative;overflow:hidden}
#map{width:100%;height:100%}
.map-badge{position:absolute;top:12px;left:12px;background:white;border:1px solid #e5e5e5;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500;z-index:1000;display:flex;align-items:center;gap:8px;pointer-events:none;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.map-dot{width:8px;height:8px;border-radius:50%;background:#1D9E75;flex-shrink:0}
.events-pane{flex:0 0 340px;border-left:1px solid #e5e5e5;display:flex;flex-direction:column;overflow:hidden;background:white}
.day-tabs{display:flex;gap:4px;padding:10px 14px;flex-shrink:0;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid #e5e5e5}
.day-tabs::-webkit-scrollbar{display:none}
.dtab{font-size:11px;padding:5px 10px;border-radius:20px;border:1px solid #e5e5e5;color:#666;cursor:pointer;white-space:nowrap;background:transparent;flex-shrink:0;transition:all .15s}
.dtab.active{background:#f0f0f0;color:#111;border-color:#ccc;font-weight:500}
.dtab:hover{background:#f7f7f7}
.evlist{flex:1;overflow-y:auto;padding:0 0 16px}
.tlabel{font-size:10px;font-weight:600;color:#999;text-transform:uppercase;letter-spacing:.06em;padding:10px 16px 5px;position:sticky;top:0;background:white;z-index:2;border-bottom:1px solid #f0f0f0}
.ecard{padding:10px 16px;cursor:pointer;border-bottom:1px solid #f5f5f5;transition:background .1s}
.ecard:hover{background:#fafafa}
.ecard.sel{background:#f5faf8;border-left:3px solid #1D9E75;padding-left:13px}
.ename{font-size:13px;font-weight:500;line-height:1.35;margin-bottom:4px}
.emeta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:3px}
.etime{font-size:11px;color:#888}
.etag{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:500}
.tag-talk{background:#e8f2fd;color:#1a5fa8}
.tag-social{background:#e2f5ee;color:#0f6e56}
.tag-workshop{background:#fef3e2;color:#7a4a0a}
.tag-studio{background:#f0eeff;color:#4a3a9a}
.tag-exhibition{background:#fdeee8;color:#8a3a1a}
.eloc{font-size:11px;color:#999;display:flex;align-items:center;gap:3px}
.pnum{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;color:white;font-size:9px;font-weight:600;margin-right:5px;flex-shrink:0;vertical-align:middle}
.detail{position:absolute;bottom:0;left:0;right:0;background:white;border-top:1px solid #e5e5e5;padding:16px 18px 18px;transform:translateY(100%);transition:transform .22s ease;z-index:1001;box-shadow:0 -4px 20px rgba(0,0,0,.08)}
.detail.open{transform:translateY(0)}
.dscroll{overflow-y:auto;max-height:200px;margin-top:8px}
.dtitle{font-size:14px;font-weight:600;line-height:1.35;padding-right:28px}
.dmeta{font-size:12px;color:#888;margin:5px 0 10px}
.ddesc{font-size:12.5px;color:#444;line-height:1.7}
.dlink{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#1D9E75;text-decoration:none;margin-top:10px;font-weight:500}
.dlink:hover{text-decoration:underline}
.dclose{position:absolute;top:16px;right:16px;background:none;border:none;cursor:pointer;color:#aaa;font-size:20px;line-height:1}
.dclose:hover{color:#555}
.empty{padding:40px 16px;text-align:center;font-size:13px;color:#aaa}
</style>
</head>

  {id:29,date:'2026-06-04',start:'15:30',end:'18:30',name:'Find Your Signal: Creative Workshop',venue:'IDEO',address:'350 Florida St, San Francisco',lat:37.7647,lng:-122.4113,type:'workshop',tag:'Workshop',desc:'Elysa Fenenbock (Stanford d.school) and Lynn Casey lead a hands-on session using futures thinking, play science, and tarot archetypes. Leave with handmade artifacts and a 90-day creative challenge.',url:'https://sfdesignweek.org/event/find-your-signal-a-hands-on-creative-workshop-for-designers/'},
  {id:30,date:'2026-06-04',start:'17:00',end:'19:15',name:'CAD, Design + AI',venue:'Groundfloor SF',address:'455 Valencia St, San Francisco',lat:37.7675,lng:-122.4218,type:'talk',tag:'Talk/Show & Tell',desc:'Mike Kuniavsky and Slate Werner host a discussion on 3D parametric CAD being transformed by AI. Bring your AI + CAD tools, projects, or workflows for show & tell.',url:'https://sfdesignweek.org/event/cad-design-ai/'}
];

const DAYS=[
  {key:'2026-06-01',label:'Mon Jun 1'},
  {key:'2026-06-02',label:'Tue Jun 2'},
  {key:'2026-06-03',label:'Wed Jun 3'},
  {key:'2026-06-04',label:'Thu Jun 4'},
];

let currentDay='2026-06-01',selectedId=null,map=null,markersMap={};

function fmt(t){
  const[h,m]=t.split(':').map(Number);
  const ap=h>=12?'PM':'AM';
  return(m===0?`${h%12||12}`:`${h%12||12}:${String(m).padStart(2,'0')}`)+' '+ap;
}
function getSlot(s){
  const h=parseInt(s);
  if(h<12)return'0_Morning';
  if(h<14)return'1_Midday';
  if(h<17)return'2_Afternoon';
  if(h<19)return'3_Evening (5–7 PM)';
  return'4_Evening (7–9 PM)';
}
function slotLabel(s){return s.replace(/^\d_/,'');}
function tagClass(t){return{talk:'tag-talk',social:'tag-social',workshop:'tag-workshop',studio:'tag-studio',exhibition:'tag-exhibition'}[t]||'tag-talk';}

function makeIcon(color,label){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="28" height="36" viewBox="0 0 28 36"><path d="M14 0C6.3 0 0 6.3 0 14c0 9.6 14 22 14 22s14-12.4 14-22C28 6.3 21.7 0 14 0z" fill="${color}"/><circle cx="14" cy="14" r="9" fill="white" opacity="0.2"/><text x="14" y="18" text-anchor="middle" font-size="10" font-weight="600" fill="white" font-family="system-ui,sans-serif">${label}</text></svg>`;
  return L.divIcon({html:svg,iconSize:[28,36],iconAnchor:[14,36],popupAnchor:[0,-36],className:''});
}

function initMap(){
  map=L.map('map',{zoomControl:true}).setView([37.775,-122.42],13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© <a href="https://openstreetmap.org">OpenStreetMap</a>',maxZoom:19
  }).addTo(map);
  renderMarkers();
}

function renderMarkers(){
  Object.values(markersMap).forEach(m=>m.remove());
  markersMap={};
  const evs=ALL_EVENTS.filter(e=>e.date===currentDay);
  const seen={};
  evs.forEach((ev,i)=>{
    const k=`${ev.lat},${ev.lng}`;
    if(seen[k])return;
    seen[k]=true;
    const grp=evs.filter(e=>`${e.lat},${e.lng}`===k);
    const color=COLORS[i%COLORS.length];
    const marker=L.marker([ev.lat,ev.lng],{icon:makeIcon(color,ev.id)}).addTo(map);
    marker.on('click',()=>openDetail(grp[0].id));
    markersMap[k]=marker;
  });
  const vc=Object.keys(seen).length;
  document.getElementById('mapLabel').textContent=`${DAYS.find(d=>d.key===currentDay)?.label} · ${evs.length} events · ${vc} venue${vc!==1?'s':''}`;
  if(evs.length){
    const lats=evs.map(e=>e.lat),lngs=evs.map(e=>e.lng),pad=0.018;
    map.fitBounds([[Math.min(...lats)-pad,Math.min(...lngs)-pad],[Math.max(...lats)+pad,Math.max(...lngs)+pad]]);
  }
}

function renderTabs(){
  const tabs=document.getElementById('dayTabs');
  tabs.innerHTML='';
  DAYS.forEach(d=>{
    const cnt=ALL_EVENTS.filter(e=>e.date===d.key).length;
    const b=document.createElement('button');
    b.className='dtab'+(d.key===currentDay?' active':'');
    b.textContent=`${d.label} (${cnt})`;
    b.onclick=()=>{currentDay=d.key;selectedId=null;closeDetail();renderTabs();renderEvents();renderMarkers();};
    tabs.appendChild(b);
  });
}

function renderEvents(){
  const list=document.getElementById('evlist');
  list.innerHTML='';
  const evs=ALL_EVENTS.filter(e=>e.date===currentDay);
  if(!evs.length){list.innerHTML='<div class="empty">No events listed for this day.</div>';return;}
  const grouped={};
  evs.forEach(e=>{const s=getSlot(e.start);if(!grouped[s])grouped[s]=[];grouped[s].push(e);});
  Object.keys(grouped).sort().forEach(slot=>{
    const lbl=document.createElement('div');
    lbl.className='tlabel';lbl.textContent=slotLabel(slot);
    list.appendChild(lbl);
    grouped[slot].sort((a,b)=>a.start.localeCompare(b.start)).forEach(ev=>{
      const card=document.createElement('div');
      card.className='ecard'+(selectedId===ev.id?' sel':'');
      card.id=`card-${ev.id}`;
      const color=COLORS[(ev.id-1)%COLORS.length];
      card.innerHTML=`<div class="ename"><span class="pnum" style="background:${color}">${ev.id}</span>${ev.name}</div>
        <div class="emeta"><span class="etime">${fmt(ev.start)}–${fmt(ev.end)}</span><span class="etag ${tagClass(ev.type)}">${ev.tag}</span></div>
        <div class="eloc">📍 ${ev.venue}</div>`;
      card.onclick=()=>openDetail(ev.id);
      list.appendChild(card);
    });
  });
}

function openDetail(id){
  const ev=ALL_EVENTS.find(e=>e.id===id);
  if(!ev)return;
  selectedId=id;
  renderEvents();
  document.getElementById('dtitle').textContent=ev.name;
  document.getElementById('dmeta').textContent=`${fmt(ev.start)} – ${fmt(ev.end)}  ·  ${ev.venue}  ·  ${ev.address}`;
  document.getElementById('ddesc').textContent=ev.desc;
  document.getElementById('dlink').href=ev.url;
  document.getElementById('detail').classList.add('open');
  if(map) map.setView([ev.lat,ev.lng],14,{animate:true});
  document.getElementById(`card-${id}`)?.scrollIntoView({block:'nearest',behavior:'smooth'});
}

function closeDetail(){
  selectedId=null;
  document.getElementById('detail').classList.remove('open');
  renderEvents();
}

document.addEventListener('DOMContentLoaded',()=>{
  renderTabs();
  renderEvents();
  initMap();
});
</script>
</body>
</html>
